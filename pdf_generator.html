<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
button { margin: 10px; padding: 10px 15px; cursor: pointer; }
#pdfPreview {
  position: fixed;
  top: 0;
  right: 0;
  width: 30%;
  height: 100%;
  background: #fff;
  border: 1px solid #ccc;
  overflow: auto;
  display: none;
  z-index: 1000;
  padding: 10px;
}
#pdfPreview .closeBtn {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #f44336;
  color: white;
  border: none;
  padding: 5px 10px;
  cursor: pointer;
}
</style>
</head>
<body>
<h2>Generate PDFs</h2>
<button id="btnResume">Generate Resume PDF (A4)</button>
<button id="btnCover">Generate Cover Letter PDF (A4)</button>
<button id="btnBoth">Generate Combined PDF (A4)</button>

<div id="pdfPreview">
  <button class="closeBtn">✖</button>
  <iframe id="pdfIframe" style="width:100%; height:calc(100% - 40px); border:none;"></iframe>
</div>

<script>
async function generatePDF(elementId, fileName) {
  // Determine which HTML file(s) to fetch
  const urls = elementId === 'btnResume' 
    ? ['Resume_iOS_Developer_Mohd_Shoeb_Formatted.html']
    : (elementId === 'btnCover' 
      ? ['Cover_Letter_iOS_Mohd_Shoeb.html']
      : ['Resume_iOS_Developer_Mohd_Shoeb_Formatted.html', 'Cover_Letter_iOS_Mohd_Shoeb.html']);
  
  // Fetch all required HTML files
  // Fetch all required HTML files
  const fetches = urls.map(url => fetch(url));
  const responses = await Promise.all(fetches);
  
  // Check for fetch errors using the actual response objects
  if (responses.some(r => !r.ok)) {
    console.error('Failed to fetch one or more HTML files');
    return;
  }
  
  // Extract text from all successful responses
  const texts = await Promise.all(responses.map(r => r.text()));
  
  // Combine HTML content if needed (for combined button)
  const combinedHTML = elementId === 'btnBoth'
    ? `<html><body style="font-size:12pt;">${texts[0]}${texts[1]}</body></html>`
    : texts[0];
  
  // Create a temporary container to hold the HTML for PDF generation
  const tempContainer = document.createElement('div');
  tempContainer.style.position = 'fixed';
  tempContainer.style.top = '-1000px';
  tempContainer.style.left = '-1000px';
  tempContainer.innerHTML = combinedHTML;
  document.body.appendChild(tempContainer);
  
  // Define PDF generation options
  const opt = {
    margin: 1,
    filename: fileName,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
  };
  
  // Generate PDF as Blob from the temporary container
  const pdfBlob = await html2pdf().from(tempContainer).set(opt).outputPdf('blob');
  
  // Clean up temporary container
  document.body.removeChild(tempContainer);
  
  // Create preview URL and display in side panel
  const previewUrl = URL.createObjectURL(pdfBlob);
  const previewContainer = document.getElementById('pdfPreview');
  const iframe = document.getElementById('pdfIframe');
  iframe.src = previewUrl;
  previewContainer.style.display = 'block';
}

// Attach click handlers to buttons
document.getElementById('btnResume').addEventListener('click', () => generatePDF('btnResume', 'Resume.pdf'));
document.getElementById('btnCover').addEventListener('click', () => generatePDF('btnCover', 'Cover_Letter.pdf'));
document.getElementById('btnBoth').addEventListener('click', () => generatePDF('btnBoth', 'Resume_and_Cover_Letter.pdf'));

// Close preview when close button is clicked
document.querySelector('.closeBtn').addEventListener('click', () => {
  const previewContainer = document.getElementById('pdfPreview');
  const iframe = document.getElementById('pdfIframe');
  previewContainer.style.display = 'none';
  iframe.src = '';
});
</script>
</body>
</html>
