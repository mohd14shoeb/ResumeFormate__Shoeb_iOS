<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Generator</title>
<!-- Production (minified) builds of React – work on GitHub Pages -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
#root { padding: 20px; }
button { margin: 10px; padding: 12px 20px; cursor: pointer; }
#previewPanel {
  position: fixed;
  top: 0;
  right: 0;
  width: 35%;
  height: 100%;
  background: #fff;
  border-left: 1px solid #ccc;
  overflow: auto;
  display: none;
  z-index: 1000;
  padding: 15px;
}
#previewPanel .closeBtn {
  position: absolute;
  top: 12px;
  left: 12px;
  background: #d33;
  color: #fff;
  border: none;
  padding: 6px 10px;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="root"></div>
<script>
function App() {
  const [previewUrl, setPreviewUrl] = React.useState(null);
  const [isPanelOpen, setIsPanelOpen] = React.useState(false);

  const generatePDF = async (type, fileName) => {
    const urls = type === 'resume'
      ? ['Resume_iOS_Developer_Mohd_Shoeb_Formatted.html']
      : type === 'cover'
        ? ['Cover_Letter_iOS_Mohd_Shoeb.html']
        : ['Resume_iOS_Developer_Mohd_Shoeb_Formatted.html', 'Cover_Letter_iOS_Mohd_Shoeb.html'];

    // fetch required HTML files
    const fetches = urls.map(u => fetch(u));
    const responses = await Promise.all(fetches);
    if (responses.some(r => !r.ok)) {
      console.error('Fetch failed');
      return;
    }
    const texts = await Promise.all(responses.map(r => r.text()));
    const combinedHTML = type === 'both'
      ? `<html><body style="font-size:12pt;">${texts[0]}${texts[1]}</body></html>`
      : texts[0];

    // hidden container for html2pdf
    const tempDiv = document.createElement('div');
    tempDiv.style.position = 'fixed';
    tempDiv.style.top = '-1000px';
    tempDiv.style.left = '-1000px';
    tempDiv.innerHTML = combinedHTML;
    document.body.appendChild(tempDiv);

    const opt = {
      margin: 1,
      filename: fileName,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
    };

    const pdfBlob = await html2pdf().from(tempDiv).set(opt).outputPdf('blob');
    document.body.removeChild(tempDiv);

    const url = URL.createObjectURL(pdfBlob);
    setPreviewUrl(url);
    setIsPanelOpen(true);
  };

  const closePreview = () => {
    setIsPanelOpen(false);
    setPreviewUrl(null);
  };

  return React.createElement(
    'div',
    null,
    React.createElement('h2', null, 'Generate PDFs'),
    React.createElement('button', { onClick: () => generatePDF('resume', 'Resume.pdf') }, 'Generate Resume PDF (A4)'),
    React.createElement('button', { onClick: () => generatePDF('cover', 'Cover_Letter.pdf') }, 'Generate Cover Letter PDF (A4)'),
    React.createElement('button', { onClick: () => generatePDF('both', 'Resume_and_Cover_Letter.pdf') }, 'Generate Combined PDF (A4)'),
    React.createElement(
      'div',
      { id: 'previewPanel', style: { display: isPanelOpen ? 'block' : 'none' } },
      React.createElement('button', { className: 'closeBtn', onClick: closePreview }, '✖'),
      React.createElement('iframe', {
        id: 'pdfIframe',
        src: previewUrl || '',
        style: { width: '100%', height: 'calc(100% - 40px)', border: 'none' }
      })
    )
  );
}

// Render the app
ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
